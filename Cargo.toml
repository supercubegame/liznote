[package]
name = "liznote"
version = "0.1.0"
edition = "2021"
description = "A cross-platform CLI todo list application"
authors = ["Randy Hopkins"]
license = "MIT"
repository = "https://github.com/supercubegame/liznote"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
colored = "2.1"
dirs = "5.0"

[[bin]]
name = "liznote"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1